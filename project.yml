name: CLOV
options:
  bundleIdPrefix: com.clov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  CLOV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CLOV/Sources
    resources:
      - path: CLOV/PrivacyInfo.xcprivacy
      - path: CLOV/Assets.xcassets
    entitlements:
      path: CLOV/CLOV.entitlements
      properties:
        aps-environment: development
    info:
      path: CLOV/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "CLO-V"
        CLOVShareBaseURL: ""
        NSPhotoLibraryUsageDescription: "CLO-V needs access to your photos so you can post a Fit-Check."
        NSLocationWhenInUseUsageDescription: "CLO-V uses your location only when you choose to tailor today's outfit prompt to the local weather."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Not in the original CLAUDE.md scope; added on request so a
        # copied share link (see ShareLinkButton) can deep-link back
        # into this app on a device that has it installed.
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["clov"]
            CFBundleURLName: com.clov.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clov.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
        product: Supabase
  CLOVUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CLOVUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: CLOV
  CLOVTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CLOVTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: CLOV
schemes:
  CLOV:
    build:
      targets:
        CLOV: all
        CLOVUITests: [test]
        CLOVTests: [test]
    test:
      targets:
        - CLOVTests
        - CLOVUITests
